name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: build (${{ matrix.preset }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [ninja-debug, ninja-release]

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install the Vulkan SDK
        run: ./.github/scripts/install-vulkan-sdk.ps1

      - name: Set up the MSVC environment
        run: ./.github/scripts/setup-msvc.ps1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: lint
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg-cache,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install the Vulkan SDK
        run: ./.github/scripts/install-vulkan-sdk.ps1

      - name: Set up the MSVC environment
        run: ./.github/scripts/setup-msvc.ps1

      - name: Install clang-format and clang-tidy
        run: python -m pip install --disable-pip-version-check "clang-format==22.1.3" "clang-tidy==22.1.8"

      - name: Configure with a compilation database
        run: cmake --preset ninja-debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Check formatting
        run: python ./.github/scripts/check-format.py

      - name: Run clang-tidy
        run: python ./.github/scripts/run-clang-tidy.py --build-directory Build/CMake/ninja-debug

  spdx:
    name: spdx
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check SPDX headers
        run: python ./.github/scripts/check-spdx.py
